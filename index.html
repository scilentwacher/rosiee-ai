<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Rossie AI</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#141414;--card2:#1d1d1d;--line:rgba(255,255,255,.09);--ink:#f6f6f6;--muted:#a1a1a8;--p:#b24bff;--g:linear-gradient(160deg,#a73cff,#ff3d77)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.icon{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px}
.pill{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 20px 6px 8px}
.pill b{display:block;font-size:.95rem;line-height:1.15}
.pill small{color:var(--muted);font-size:.7rem}
.star{width:32px;height:32px;border-radius:50%;background:#0c0c0c;display:grid;place-items:center}
.star svg{width:18px;height:18px}
#snd .off{display:none}#snd.muted .on{display:none}#snd.muted .off{display:block}
#log{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:18px}
#hero{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
#orb{width:min(58vw,230px);aspect-ratio:1;filter:drop-shadow(0 0 22px rgba(200,80,255,.45));margin-bottom:14px}
.hi{margin:0;color:var(--muted);font-size:.95rem}
h2{margin:6px 0 0;font-size:2.05rem;line-height:1.15;font-weight:600;max-width:12ch}
.by{margin:12px 0 0;font-size:.75rem;color:var(--muted);opacity:.8}
.by a{color:#d9b3ff;text-decoration:none}
.row{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.row.me{justify-content:flex-end}
.bubble{background:linear-gradient(135deg,#8a3dff,#c04dff);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 15px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.av{width:26px;height:26px;border-radius:50%;background:conic-gradient(#ff9a3d,#e84dff,#6a5cff,#ff9a3d);position:relative;flex:none;margin-top:2px}
.av::after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a2a63,#000 70%)}
.body{min-width:0;flex:1;overflow-wrap:anywhere}
.body p{margin:0 0 .6em}.body p:last-child{margin:0}
.body ul,.body ol{margin:.2em 0 .7em;padding-left:1.3em}
.body code{background:#1c1c1c;border-radius:6px;padding:1px 6px;font-size:.9em}
.body pre{background:#0d0d0d;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:.5em 0}
.body pre code{background:none;padding:0}
.copy{background:none;border:0;color:var(--muted);font-size:.8rem;padding:4px 0;margin-top:4px}
.err{align-self:center;color:#ff9b93;font-size:.9rem;text-align:center}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:bob 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.chips{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px}
.chips i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:.85rem;color:#d9b3ff}
.chips button:active{border-color:var(--p)}
form{display:flex;align-items:flex-end;gap:6px;margin:0 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px}
form:focus-within{border-color:var(--p)}
form .plus{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center}
form .plus svg{width:22px;height:22px}
textarea{flex:1;resize:none;max-height:130px;font:inherit;color:var(--ink);background:none;border:0;outline:0;padding:9px 0}
textarea::placeholder{color:var(--muted)}
#go{width:44px;height:44px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
#go:disabled{opacity:.5}
#go svg{width:21px;height:21px}
#go .ar{display:none}#go.has .ar{display:block}#go.has .mi{display:none}
#voice{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;background:radial-gradient(ellipse 130% 46% at 50% 108%,rgba(255,40,90,.9),rgba(140,20,90,.4) 45%,transparent 72%),#000;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(26px + env(safe-area-inset-bottom,0px))}
#voice.on{display:flex}
.vtop{width:100%;display:flex;justify-content:space-between}
#wave{width:100%;height:150px;margin-top:34px}
#vtimer{margin:14px 0 0;font-size:1.5rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}
#vtext{margin:14px 0 0;flex:1;min-height:0;overflow-y:auto;text-align:center;font-size:1.1rem;line-height:1.5;max-width:30ch;color:#e7e7ea}
.vctl{display:flex;align-items:center;gap:34px}
#vmic{width:84px;height:84px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 12px rgba(255,255,255,.1),0 0 0 26px rgba(255,255,255,.05)}
#vmic svg{width:34px;height:34px}
#voice.live #vmic{animation:pulse 1.2s ease-in-out infinite}
#drawer{position:fixed;inset:0;z-index:25;display:none;background:rgba(0,0,0,.6)}
#drawer.on{display:block}
.sheet{width:min(84vw,330px);height:100%;background:#0b0b0b;border-right:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 14px 20px;overflow-y:auto}
.sheet h3{margin:0 0 12px;font-size:1.1rem}
.newc{width:100%;background:var(--g);border:0;border-radius:14px;padding:11px;font-weight:600;color:#fff;margin-bottom:14px}
.h-item{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;margin-bottom:8px}
.h-title{flex:1;min-width:0;background:none;border:0;text-align:left;font-size:.9rem;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 0}
.h-del{background:none;border:0;color:var(--muted);font-size:1.3rem;padding:2px 10px}
.empty{color:var(--muted);font-size:.9rem}
.ava{width:28px;height:28px;border-radius:50%;background:#3a2a55 center/cover;color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;margin-top:2px}
.ava.big{width:84px;height:84px;font-size:2rem;margin:0}
.who{display:flex;align-items:center;gap:10px;margin-bottom:14px}.who b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shr{display:none;gap:8px;margin-bottom:14px}.shr button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px}
#settings{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#settings.on{display:flex}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.sbody{flex:1;overflow-y:auto;padding:4px 16px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sbody label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.sbody h4{margin:10px 0 0;font-size:.95rem}
.sbody input:not(.sw),.sbody select,.sbody textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:11px 12px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.sbody .rowl{flex-direction:row;align-items:center;justify-content:space-between;padding:8px 0;color:var(--ink);font-size:1rem}
.rowl select{width:auto;max-width:55%}
.prof{display:flex;align-items:center;gap:16px;padding:14px}
.chipb{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem}
.memi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.addm{display:flex;gap:8px;padding:10px 0}
.note{font-size:.78rem;color:var(--muted);margin:0}
.danger{background:none;border:1px solid #6b2230;color:#ff8a9a;border-radius:14px;padding:12px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#333;position:relative;border:0;flex:none;margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--p)}.sw:checked::after{left:21px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;border:1px solid var(--line);border-radius:999px;padding:8px 16px;z-index:50;display:none;font-size:.9rem}#toast.on{display:block}
#go .st{display:none}#go.busy .st{display:block}#go.busy .mi,#go.busy .ar{display:none}
.pic{display:block;width:180px;max-width:100%;border-radius:12px;margin:0 0 8px}
#atts{display:none;gap:8px;overflow-x:auto;padding:4px 14px 8px}
#atts.on{display:flex}
.at{position:relative;flex:none}
.at img{width:58px;height:58px;object-fit:cover;border-radius:12px;display:block}
.at.f{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 34px 8px 12px;font-size:.85rem;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.at button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#333;color:#fff;font-size:.7rem;line-height:1;display:grid;place-items:center}
.at.f button{top:50%;right:6px;transform:translateY(-50%)}
#sheet{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#sheet.on{display:flex}
.panel{width:100%;background:#161616;border-radius:28px 28px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph b{flex:1;text-align:center}
.tl3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tl3 button,.prow{background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--ink)}
.tl3 button{padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tl3 .ci{width:46px;height:46px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.tl3 svg,.prow svg{width:22px;height:22px}
.prow{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left;font-size:1rem}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <button class="icon" data-act="menu" aria-label="Chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <div class="pill"><span class="star"><svg viewBox="0 0 24 24"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a3d"/><stop offset="1" stop-color="#b24bff"/></linearGradient></defs><path fill="url(#sg)" d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></span><div><b>Rossie</b><small>AI Assistant</small></div></div>
  <button class="icon" id="snd" aria-label="Read replies aloud"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4zM17 9a4 4 0 0 1 0 6"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4zM17 9l5 6M22 9l-5 6"/></svg></button>
</header>
<main id="log" aria-live="polite"></main>
<div class="chips" id="chips">
  <button data-p="Explain something to me in simple words. Ask me which topic."><i>✦</i>Explain</button>
  <button data-p="Help me with my homework. Ask me the subject and the question."><i>✎</i>Homework</button>
  <button data-p="Help me write a message. Ask me who it is for and what I want to say."><i>✉</i>Write</button>
  <button data-p="Help me translate something. Ask me the languages."><i>⇄</i>Translate</button>
  <button data-p="Give me one smart business idea I can start with little money."><i>◎</i>Ideas</button>
  <button data-p="Tell me a surprising fun fact."><i>★</i>Fun fact</button>
  <button data-p="Help me summarize a text. Ask me to paste it."><i>≡</i>Summarize</button>
  <button data-p="Give me one practical tip to be more productive today."><i>✓</i>Tips</button>
  <button data-p="Help me with a coding problem. Ask me the language and what I am building."><i>‹›</i>Code</button>
  <button data-p="Check my grammar and improve my writing. Ask me to paste the text."><i>Aa</i>Grammar</button>
  <button data-p="Give me practical career advice. Ask me about my situation first."><i>↗</i>Career</button>
  <button data-p="Help me plan a trip. Ask me where, when and my budget."><i>⌂</i>Travel</button>
</div>
<div id="atts"></div>
<form id="form">
  <button class="plus" type="button" data-act="sheet" aria-label="Add to chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <textarea id="input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
  <button id="go" type="submit" aria-label="Send or speak">
    <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <svg class="st" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
  </button>
</form>
<div id="drawer"><div class="sheet"><div class="who"><span class="ava"></span><b id="dname">Guest</b><button class="icon" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div><button class="newc" data-act="newchat">+ New chat</button><div class="shr" id="shr"><button data-act="share">Share chat</button><button data-act="dl">Download .txt</button></div><h3>Chats</h3><div id="hlist"></div></div></div>
<div id="voice" role="dialog" aria-label="Voice mode">
  <div class="vtop"><button class="icon" id="vclose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="icon" id="vkb" aria-label="Type instead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg></button></div>
  <canvas id="wave"></canvas>
  <p id="vtimer">00:00</p>
  <p id="vtext"></p>
  <div class="vctl">
    <button class="icon" id="vpause" aria-label="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button id="vmic" aria-label="Tap to speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="icon" id="vx" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>
<div id="sheet"><div class="panel" role="dialog" aria-label="Add to chat">
  <div class="ph"><button class="icon" data-act="sclose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><b>Add to chat</b><span style="width:44px"></span></div>
  <div class="tl3">
    <button data-act="cam"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>Camera</button>
    <button data-act="pho"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg></span>Photos</button>
    <button data-act="fil"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6M9.5 13.5L12 11l2.5 2.5"/></svg></span>Files</button>
  </div>
  <button class="prow" data-act="newchat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
</div></div>
<input type="file" id="fcam" accept="image/*" capture="environment" hidden>
<input type="file" id="fpho" accept="image/*" multiple hidden>
<input type="file" id="ffile" accept=".txt,.md,.csv,.json,.js,.ts,.py,.java,.c,.cpp,.html,.css,.xml,.log,.yml,.yaml,.sql,text/*" hidden>
<div id="settings" role="dialog" aria-label="Settings">
  <div class="shead"><button class="icon" id="sback" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><b>Settings</b><span style="width:44px"></span></div>
  <div class="sbody">
    <div class="card prof"><span class="ava big"></span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chipb" data-act="avpick">Edit photo</button><button class="chipb" data-act="avrm">Remove</button></div><input type="file" id="avfile" accept="image/*" hidden></div>
    <label>What should Rossie call you?<input id="sname" maxlength="40" placeholder="Your name" autocomplete="off"></label>
    <h4>Personality</h4>
    <div class="card">
      <label class="rowl">Style and tone<select id="stone"><option value="default">Default</option><option value="professional">Professional</option><option value="friendly">Friendly</option><option value="candid">Candid</option><option value="quirky">Quirky</option><option value="efficient">Efficient</option><option value="cynical">Cynical</option></select></label>
      <label class="rowl">Warmth<input type="checkbox" class="sw" id="swarm"></label><label class="rowl">Enthusiasm<input type="checkbox" class="sw" id="senth"></label><label class="rowl">Headers and lists<input type="checkbox" class="sw" id="slists"></label><label class="rowl">Emoji<input type="checkbox" class="sw" id="semoji"></label>
    </div>

  </div>
</div>
<div id="toast" role="status"></div>
<script>
const PROXY_URL = "https://rossie-ai.shinermathew.workers.dev";
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), go = $("go"), chips = $("chips");
let history = [], chatId = null, speakAll = false, busy = false, ctrl = null, att = {imgs:[], file:null};
const DEF = {name:"", avatar:"", tone:"default", warmth:true, enth:true, lists:true, emoji:true, custom:"", lang:"auto", memOn:true, mem:[]};
const LANGS = {auto:["Auto",""], en:["English","en-US"], hi:["Hindi","hi-IN"], ml:["Malayalam","ml-IN"], ta:["Tamil","ta-IN"], te:["Telugu","te-IN"], ar:["Arabic","ar-SA"], es:["Spanish","es-ES"], fr:["French","fr-FR"]};
let S = Object.assign({}, DEF, (() => { try { return JSON.parse(localStorage.getItem("rossie-set") || "{}"); } catch (e) { return {}; } })());
function saveS(){ try { localStorage.setItem("rossie-set", JSON.stringify(S)); } catch (e) { toast("Could not save (photo too large?)"); } }
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 1800); }
function vlang(){ return (LANGS[S.lang] && LANGS[S.lang][1]) || vlang(); }
function prof(){ return {name:S.name, tone:S.tone, warmth:S.warmth, enth:S.enth, lists:S.lists, emoji:S.emoji, custom:S.custom, lang:S.lang === "auto" ? "" : LANGS[S.lang][0], mem:S.memOn ? S.mem : []}; }
function greet(){ const n = (S.name || "").trim().split(/\s+/)[0]; return n ? "Hi " + n + ", I’m Rossie!" : "Hi, I’m Rossie!"; }
function ini(el){ el.style.backgroundImage = S.avatar ? "url(" + S.avatar + ")" : ""; el.textContent = S.avatar ? "" : ((S.name || "?").trim()[0] || "?").toUpperCase(); }
function paintAll(){ document.querySelectorAll(".ava").forEach(ini); $("dname").textContent = S.name || "Guest"; }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(src){
  const blocks = [];
  src = esc(src).replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (m, c) => { blocks.push(c.replace(/\n$/, "")); return "\u0000" + (blocks.length - 1) + "\u0000"; });
  const inline = t => t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  let out = "", list = null;
  const close = () => { if (list) { out += "</" + list + ">"; list = null; } };
  for (const raw of src.split("\n")) {
    let m;
    if (/^\u0000\d+\u0000$/.test(raw.trim())) { close(); out += raw.trim(); }
    else if ((m = raw.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if ((m = raw.match(/^#{1,4}\s+(.*)/))) { close(); out += "<p><strong>" + inline(m[1]) + "</strong></p>"; }
    else if (!raw.trim()) close();
    else { close(); out += "<p>" + inline(raw) + "</p>"; }
  }
  close();
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => "<pre><code>" + blocks[i] + "</code></pre>");
}

/* saved chats */
function load(){ try { return JSON.parse(localStorage.getItem("rossie-chats") || "[]"); } catch (e) { return []; } }
function store(a){ try { localStorage.setItem("rossie-chats", JSON.stringify(a.slice(0, 20))); } catch (e) {} }
function store(a){ try { localStorage.setItem("rossie-chats", JSON.stringify([...a.filter(c => c.pin), ...a.filter(c => !c.pin)].slice(0, 30))); } catch (e) {} }
function saveChat(){
  if (!history.length) return;
  const a = load(); if (!chatId) chatId = Date.now().toString(36);
  const i = a.findIndex(c => c.id === chatId), old = i >= 0 ? a[i] : null;
  const rec = {id:chatId, title:old ? old.title : (history[0].shown || history[0].content).split("\n")[0].slice(0, 48), pin:old ? !!old.pin : false, msgs:history.map(m => ({role:m.role, content:m.content, shown:m.shown}))};
  if (i >= 0) a[i] = rec; else a.unshift(rec);
  store(a);
}
function renderList(){
  const a = load();
  $("hlist").innerHTML = a.length ? a.map(c => '<div class="h-item"><button class="h-del" data-act="pin" data-id="' + c.id + '" aria-label="Pin" style="' + (c.pin ? "color:#ffcf5a" : "") + '">' + (c.pin ? "★" : "☆") + '</button><button class="h-title" data-act="open" data-id="' + c.id + '">' + esc(c.title) + '</button><button class="h-del" data-act="ren" data-id="' + c.id + '" aria-label="Rename">✎</button><button class="h-del" data-act="del" data-id="' + c.id + '" aria-label="Delete">✕</button></div>').join("") : '<p class="empty">No saved chats yet.</p>';
}
function menu(on){ if (on) { renderList(); paintAll(); $("shr").style.display = history.length ? "flex" : "none"; } $("drawer").classList.toggle("on", on); }
function chatText(){ return history.map(m => (m.role === "user" ? (S.name || "You") : "Rossie") + ": " + (m.shown || m.content)).join("\n\n") + "\n\n— Rossie AI by Shine R Mathew"; }

/* screens */
function home(){
  history = []; chatId = null; att = {imgs:[], file:null}; renderAtts();
  log.innerHTML = '<section id="hero"><canvas id="orb"></canvas><p class="hi">' + esc(greet()) + '</p><h2>How can I help you today?</h2><p class="by">Made by <a href="https://www.instagram.com/iam.sh1ne/" target="_blank" rel="noopener">Shine R Mathew</a> · @iam.sh1ne</p></section>';
  chips.style.display = "";
}
function scrollDown(){ log.scrollTop = log.scrollHeight; }
function start(){ const h = $("hero"); if (h) h.remove(); chips.style.display = "none"; }
function addMe(text, at){
  start();
  const r = document.createElement("div"); r.className = "row me";
  const b = document.createElement("div"); b.className = "bubble";
  if (at && at.imgs) at.imgs.forEach(u => { const im = document.createElement("img"); im.src = u; im.className = "pic"; b.appendChild(im); });
  const t = document.createElement("div"); t.textContent = text + (at && at.file ? "\n▤ " + at.file.name : ""); b.appendChild(t);
  r.appendChild(b);
  if (S.name || S.avatar) { const a = document.createElement("span"); a.className = "ava"; ini(a); r.appendChild(a); }
  log.appendChild(r); scrollDown();
}
function addAI(){
  const r = document.createElement("div"); r.className = "row ai";
  r.innerHTML = '<span class="av"></span><div class="body"><span class="dots"><span></span><span></span><span></span></span></div>';
  log.appendChild(r); scrollDown(); return r;
}
function fill(row, text){
  const body = row.querySelector(".body");
  body.innerHTML = md(text);
  const c = document.createElement("button"); c.className = "copy"; c.textContent = "Copy";
  c.onclick = async () => { try { await navigator.clipboard.writeText(text); c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1500); } catch (e) {} };
  body.appendChild(c);
}
function addErr(t){ const d = document.createElement("div"); d.className = "err"; d.textContent = t; log.appendChild(d); scrollDown(); }
function openChat(id){
  const c = load().find(x => x.id === id); if (!c) return;
  history = c.msgs.slice(); chatId = id; log.innerHTML = ""; start();
  for (const m of history) { if (m.role === "user") addMe(m.shown || m.content); else { const r = addAI(); fill(r, m.content); } }
  scrollDown();
}

function hasAtt(){ return att.imgs.length > 0 || !!att.file; }
function renderAtts(){
  const z = $("atts");
  z.innerHTML = att.imgs.map((u, i) => '<div class="at"><img src="' + u + '" alt="Photo ' + (i + 1) + '"><button data-act="rmimg" data-id="' + i + '" aria-label="Remove photo">✕</button></div>').join("") + (att.file ? '<div class="at f"><span>▤ ' + esc(att.file.name) + '</span><button data-act="rmfile" aria-label="Remove file">✕</button></div>' : "");
  z.classList.toggle("on", hasAtt());
  go.classList.toggle("has", !!input.value.trim() || hasAtt());
}
function shrink(f){
  return new Promise((ok, no) => {
    const im = new Image();
    im.onload = () => { const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src); ok(c.toDataURL("image/jpeg", 0.8)); };
    im.onerror = () => no(); im.src = URL.createObjectURL(f);
  });
}
async function addImgs(files){
  for (const f of files) { if (att.imgs.length >= 3) { toast("Max 3 photos"); break; } try { att.imgs.push(await shrink(f)); } catch (e) { toast("Couldn’t read that photo"); } }
  renderAtts();
}
async function addFile(f){
  if (!f) return;
  if (f.size > 2e6) { toast("File too large (max 2 MB)"); return; }
  let t = ""; try { t = await f.text(); } catch (e) {}
  if (!t || /\u0000/.test(t.slice(0, 2000))) { toast("Only text files for now (txt, md, csv, json, code)"); return; }
  att.file = {name:f.name.slice(0, 60), text:t.slice(0, 12000) + (t.length > 12000 ? "\n[…truncated]" : "")};
  renderAtts();
}
function sheet(on){ $("sheet").classList.toggle("on", on); }
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") sheet(false); });
$("fcam").onchange = $("fpho").onchange = e => { addImgs([...e.target.files]); e.target.value = ""; };
$("ffile").onchange = e => { addFile(e.target.files[0]); e.target.value = ""; };
function setBusy(b){ busy = b; go.classList.toggle("busy", b); }
function stopGen(){ if (ctrl) ctrl.abort(); if ("speechSynthesis" in window) speechSynthesis.cancel(); }
function maybeRemember(t){
  if (!S.memOn) return;
  const m = t.match(/^\s*(?:please\s+)?remember(?:\s+that)?[:,]?\s+(.{3,200})$/i);
  if (m) { const v = m[1].trim(); if (!S.mem.includes(v)) { S.mem.push(v); S.mem = S.mem.slice(-20); saveS(); toast("Saved to memory"); } }
}
function buildMsgs(){
  return history.slice(-20).map((m, i, a) => (m.imgs && i === a.length - 1)
    ? {role:"user", content:[{type:"text", text:m.content}, ...m.imgs.map(u => ({type:"image_url", image_url:{url:u}}))]}
    : {role:m.role, content:m.content});
}
async function ask(text, spoken, at){
  if (busy) return;
  maybeRemember(text);
  const imgs = at && at.imgs && at.imgs.length ? at.imgs.slice() : null, file = at && at.file;
  const content = text + (file ? "\n\n[File: " + file.name + "]\n" + file.text : "") + (imgs ? "\n[photo attached]" : "");
  const shown = text + (file ? "\n▤ " + file.name : "") + (imgs ? "\n▣ " + imgs.length + " photo" + (imgs.length > 1 ? "s" : "") : "");
  addMe(text, {imgs, file}); history.push({role:"user", content, shown, imgs});
  setBusy(true); ctrl = new AbortController();
  const row = addAI(), body = row.querySelector(".body"); let out = "", pend = false, fin = false;
  const paint = () => { pend = false; if (fin) return; body.innerHTML = md(out); scrollDown(); };
  try {
    const res = await fetch(PROXY_URL, {method:"POST", headers:{"Content-Type":"application/json"}, signal:ctrl.signal, body:JSON.stringify({messages:buildMsgs(), stream:true, profile:prof()})});
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error((d.error && d.error.message) || "Request failed (" + res.status + ")"); }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const {done, value} = await rd.read(); if (done) break;
      buf += dec.decode(value, {stream:true}); const lines = buf.split("\n"); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith("data:")) continue; const d = ln.slice(5).trim(); if (!d || d === "[DONE]") continue;
        try { const t = JSON.parse(d).choices[0].delta.content; if (t) { out += t; if (!pend) { pend = true; requestAnimationFrame(paint); } } } catch (e) {}
      }
    }
    if (!out.trim()) throw new Error("Empty reply");
  } catch (err) {
    if (!out.trim()) {
      fin = true; row.remove(); history.pop(); setBusy(false);
      if (err.name !== "AbortError") { addErr("Sorry, something went wrong: " + err.message + ". Please try again."); if (spoken) $("vtext").textContent = "Something went wrong. Tap the mic to try again."; }
      return;
    }
  }
  fin = true; fill(row, out); history.push({role:"assistant", content:out}); saveChat();
  if ((spoken || speakAll) && !ctrl.signal.aborted) speak(out);
  setBusy(false); scrollDown();
}

/* voice mode */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, vt0 = 0, vint = null;
function speak(t){
  const clean = t.replace(/[*`#_]/g, "");
  $("vtext").textContent = clean;
  if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(clean); u.lang = vlang(); speechSynthesis.cancel(); speechSynthesis.speak(u); }
}
function tick(){ const s = Math.floor((Date.now() - vt0) / 1000); $("vtimer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function openVoice(){
  $("voice").classList.add("on"); vt0 = Date.now(); tick(); clearInterval(vint); vint = setInterval(tick, 1000);
  $("vtext").textContent = SR ? "Tap the mic and speak" : "Voice needs Chrome or Safari on your phone.";
}
function stopAll(){ if (rec && listening) rec.stop(); if ("speechSynthesis" in window) speechSynthesis.cancel(); }
function closeVoice(){ stopAll(); clearInterval(vint); $("voice").classList.remove("on", "live"); }
function toggleListen(){
  if (!SR) return;
  if (listening) { rec.stop(); return; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  rec = new SR(); rec.lang = vlang(); rec.interimResults = true; rec.continuous = false;
  let finalText = "";
  rec.onstart = () => { listening = true; $("voice").classList.add("live"); $("vtext").textContent = "Listening…"; };
  rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; finalText = t; $("vtext").textContent = t; };
  rec.onerror = e => { $("vtext").textContent = e.error === "not-allowed" ? "Allow microphone access, then tap the mic again." : "Didn’t catch that. Tap the mic again."; };
  rec.onend = () => { listening = false; $("voice").classList.remove("live"); if (finalText.trim()) { $("vtext").textContent = "Thinking…"; ask(finalText.trim(), true); } };
  try { rec.start(); } catch (e) {}
}

/* animated art: wireframe orb + waveform */
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
function fit(c){ const w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr); if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } return w > 0; }
const STOPS = [[255,150,60],[232,77,255],[106,92,255]];
function col(k, a){ k = Math.max(0, Math.min(1, k)) * 2; const i = Math.min(1, Math.floor(k)), f = k - i, A = STOPS[i], B = STOPS[i + 1]; return "rgba(" + Math.round(A[0] + (B[0] - A[0]) * f) + "," + Math.round(A[1] + (B[1] - A[1]) * f) + "," + Math.round(A[2] + (B[2] - A[2]) * f) + "," + a + ")"; }
function drawOrb(c, t){
  const ctx = c.getContext("2d"), W = c.width, R = W * 0.36, cx = W / 2, cy = c.height / 2, tilt = 0.45, ct = Math.cos(tilt), st = Math.sin(tilt);
  ctx.clearRect(0, 0, W, c.height); ctx.lineWidth = Math.max(1, dpr * 0.9); ctx.lineCap = "round";
  const P = (lat, lon) => {
    const r = R * (1 + 0.09 * Math.sin(3 * lon + 2 * lat + t * 1.2) + 0.05 * Math.sin(5 * lat - t));
    const x = r * Math.cos(lat) * Math.cos(lon), y = r * Math.sin(lat), z = r * Math.cos(lat) * Math.sin(lon);
    const y2 = y * ct - z * st, z2 = y * st + z * ct, s = 1 + z2 / (R * 4);
    return [cx + x * s, cy + y2 * s, z2];
  };
  const seg = (a, b) => { const k = ((a[1] + b[1]) / 2 - (cy - R)) / (2 * R), d = (a[2] + b[2]) / 2; ctx.strokeStyle = col(k, 0.25 + 0.75 * (d + R) / (2 * R)); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
  for (let m = 0; m < 16; m++) { const lon = m * Math.PI / 8 + t * 0.4; let p = P(-Math.PI / 2, lon); for (let j = 1; j <= 24; j++) { const q = P(-Math.PI / 2 + j * Math.PI / 24, lon); seg(p, q); p = q; } }
  for (let k = -6; k <= 6; k++) { const lat = k * Math.PI / 14; let p = P(lat, t * 0.4); for (let j = 1; j <= 40; j++) { const q = P(lat, t * 0.4 + j * Math.PI / 20); seg(p, q); p = q; } }
}
let energy = 0.2;
function drawWave(c, t){
  const ctx = c.getContext("2d"), W = c.width, H = c.height;
  const target = listening ? 1 : (("speechSynthesis" in window && speechSynthesis.speaking) ? 0.8 : 0.2);
  energy += (target - energy) * 0.08;
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, "#5ad1ff"); g.addColorStop(0.5, "#b24bff"); g.addColorStop(1, "#ff4da6");
  ctx.strokeStyle = g; ctx.lineWidth = 1.2 * dpr;
  for (let k = 0; k < 9; k++) {
    ctx.globalAlpha = 0.25 + 0.075 * k; ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const u = x / W, env = Math.pow(Math.sin(Math.PI * u), 1.5);
      const y = H / 2 + env * H * 0.42 * energy * (Math.sin(u * 6 + t * 1.6 + k * 0.45) * 0.6 + Math.sin(u * 11 - t * 2.1 + k * 0.8) * 0.4);
      if (x) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function frame(ms){
  const t = reduce ? 0 : ms / 1000;
  if (!document.hidden) {
    const o = $("orb"); if (o && fit(o)) drawOrb(o, t);
    if ($("voice").classList.contains("on")) { const w = $("wave"); if (fit(w)) drawWave(w, t); }
  }
  requestAnimationFrame(frame);
}

/* wiring */
$("vmic").onclick = toggleListen;
$("vclose").onclick = $("vx").onclick = closeVoice;
$("vpause").onclick = stopAll;
$("vkb").onclick = () => { closeVoice(); input.focus(); };
$("snd").onclick = () => { speakAll = !speakAll; $("snd").classList.toggle("muted", !speakAll); if (!speakAll && "speechSynthesis" in window) speechSynthesis.cancel(); };
$("snd").classList.add("muted");
$("drawer").addEventListener("click", e => { if (e.target.id === "drawer") menu(false); });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-p],[data-act]"); if (!el) return;
  if (el.dataset.p) { ask(el.dataset.p); return; }
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "menu") menu(true);
  else if (a === "newchat") { menu(false); sheet(false); home(); }
  else if (a === "sheet") sheet(true);
  else if (a === "sclose") sheet(false);
  else if (a === "cam") { sheet(false); $("fcam").click(); }
  else if (a === "pho") { sheet(false); $("fpho").click(); }
  else if (a === "fil") { sheet(false); $("ffile").click(); }
  else if (a === "rmimg") { att.imgs.splice(+id, 1); renderAtts(); }
  else if (a === "rmfile") { att.file = null; renderAtts(); }
  else if (a === "open") { menu(false); openChat(id); }
  else if (a === "del") { if (confirm("Delete this chat?")) { store(load().filter(c => c.id !== id)); renderList(); } }
  else if (a === "pin") { const l = load(), c = l.find(x => x.id === id); if (c) { c.pin = !c.pin; store(l); renderList(); } }
  else if (a === "ren") { const l = load(), c = l.find(x => x.id === id); const t = c && prompt("Rename chat", c.title); if (t && t.trim()) { c.title = t.trim().slice(0, 60); store(l); renderList(); } }
  else if (a === "settings") openSet();
  else if (a === "share") { if (navigator.share) navigator.share({title:"Rossie AI chat", text:chatText()}).catch(() => {}); else navigator.clipboard.writeText(chatText()).then(() => toast("Chat copied")).catch(() => {}); }
  else if (a === "dl") { const b = new Blob([chatText()], {type:"text/plain"}), l = document.createElement("a"); l.href = URL.createObjectURL(b); l.download = "rossie-chat.txt"; l.click(); }
  else if (a === "avpick") $("avfile").click();
  else if (a === "avrm") { S.avatar = ""; saveS(); paintAll(); }
  else if (a === "memadd") { const v = $("memin").value.trim(); if (v) { S.mem.push(v.slice(0, 200)); S.mem = S.mem.slice(-20); saveS(); $("memin").value = ""; memList(); } }
  else if (a === "rmmem") { S.mem.splice(+id, 1); saveS(); memList(); }
  else if (a === "wipe") { if (confirm("Delete all chats, memories and settings on this phone?")) { try { localStorage.removeItem("rossie-chats"); localStorage.removeItem("rossie-set"); } catch (e) {} location.reload(); } }
});
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
  go.classList.toggle("has", !!input.value.trim());
});
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(hover:hover)").matches) { e.preventDefault(); $("form").requestSubmit(); } });
$("form").addEventListener("submit", e => {
  e.preventDefault();
  if (busy) { stopGen(); return; }
  let t = input.value.trim();
  if (!t && !hasAtt()) { openVoice(); return; }
  if (!t) t = att.imgs.length ? "What is in this photo?" : "Summarize this file.";
  const at = {imgs:att.imgs, file:att.file}; att = {imgs:[], file:null};
  input.value = ""; input.style.height = "auto"; renderAtts(); ask(t, false, at);
});
function memList(){ $("memlist").innerHTML = S.mem.map((m, i) => '<div class="memi"><span>' + esc(m) + '</span><button class="h-del" data-act="rmmem" data-id="' + i + '" aria-label="Forget">✕</button></div>').join(""); }
function openSet(){
  menu(false); $("settings").classList.add("on");
  $("sname").value = S.name; $("stone").value = S.tone; $("scustom").value = S.custom; $("slang").value = S.lang;
  [["swarm","warmth"],["senth","enth"],["slists","lists"],["semoji","emoji"],["smem","memOn"]].forEach(([id, k]) => $(id).checked = !!S[k]);
  memList(); paintAll();
}
$("slang").innerHTML = Object.entries(LANGS).map(([k, v]) => '<option value="' + k + '">' + v[0] + '</option>').join("");
$("sback").onclick = () => { $("settings").classList.remove("on"); home(); };
$("sname").oninput = e => { S.name = e.target.value.slice(0, 40); saveS(); paintAll(); };
$("stone").onchange = e => { S.tone = e.target.value; saveS(); };
[["swarm","warmth"],["senth","enth"],["slists","lists"],["semoji","emoji"],["smem","memOn"]].forEach(([id, k]) => $(id).onchange = e => { S[k] = e.target.checked; saveS(); });
$("scustom").oninput = e => { S.custom = e.target.value; saveS(); };
$("slang").onchange = e => { S.lang = e.target.value; saveS(); };
$("avfile").onchange = e => {
  const f = e.target.files[0]; if (!f) return; const img = new Image();
  img.onload = () => { const c = document.createElement("canvas"), m = Math.min(img.width, img.height); c.width = c.height = 160; c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 160, 160); S.avatar = c.toDataURL("image/jpeg", 0.8); saveS(); paintAll(); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};
paintAll();
home();
requestAnimationFrame(frame);
</script>
</body>
