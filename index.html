<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rossie AI</title>
<style>
:root{color-scheme:dark;--bg:#232323;--surface:#2D2D2D;--ink:#f3eefc;--muted:#a9a3b8;--accent:#C5A3FF;--on-accent:#2D2D2D;--user:#C5A3FF;--line:#404040}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{font-size:1.1rem;margin:0}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--user);color:#2D2D2D;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.err{align-self:center;color:#ff9b93;font-size:.9rem;text-align:center}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:28ch}
form{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
textarea{flex:1;resize:none;max-height:120px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#send{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:0 18px;font-weight:600}
#send:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input,select,dialog textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:10px;border-radius:10px}
.primary{background:var(--accent);color:var(--on-accent);border:0;font-weight:600}
small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Rossie AI</h1>
  <div><button class="ghost" id="clear">New chat</button> <button class="ghost" id="open">Settings</button></div>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<dialog id="settings">
  <h2 style="margin:0 0 4px;font-size:1.1rem">Settings</h2>
  <small>Your key stays in this browser only.</small>
  <label for="provider">Provider</label>
  <select id="provider">
    <option value="groq">Groq (free tier)</option>
    <option value="openrouter">OpenRouter (free models)</option>
  </select>
  <label for="key">API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="Paste your key">
  <label for="model">Model name</label>
  <input id="model" list="models" autocomplete="off">
  <datalist id="models"></datalist>
  <button class="ghost" id="load" type="button" style="margin-top:8px;width:100%">Load available models</button>
  <small id="loadmsg"></small>
  <label for="sys">Instructions for the AI</label>
  <textarea id="sys" rows="3"></textarea>
  <div class="row">
    <button class="ghost" id="cancel" type="button">Cancel</button>
    <button class="primary" id="save" type="button">Save</button>
  </div>
</dialog>

<script>
const PROVIDERS = {
  groq: {url:"https://api.groq.com/openai/v1/chat/completions", model:"openai/gpt-oss-20b", list:"https://api.groq.com/openai/v1/models"},
  openrouter: {url:"https://openrouter.ai/api/v1/chat/completions", model:"openrouter/free", list:"https://openrouter.ai/api/v1/models"}
};
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), dlg = $("settings");
let history = [];
let cfg = {provider:"groq", key:"", model:PROVIDERS.groq.model, sys:"You are Rossie AI, a helpful, friendly assistant. If asked your name, say you are Rossie AI. Keep answers clear and short."};

try { Object.assign(cfg, JSON.parse(localStorage.getItem("rossie-cfg") || "{}")); } catch (e) {}

if (cfg.model === "llama-3.3-70b-versatile") cfg.model = PROVIDERS.groq.model;
function saveCfg(){ try { localStorage.setItem("rossie-cfg", JSON.stringify(cfg)); } catch (e) {} }

function add(cls, text){
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  const empty = log.querySelector(".empty"); if (empty) empty.remove();
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function showEmpty(){
  log.innerHTML = '<div class="empty">Ask me anything. Add your API key in Settings to start.</div>';
}
function openSettings(){
  $("provider").value = cfg.provider; $("key").value = cfg.key;
  $("model").value = cfg.model; $("sys").value = cfg.sys; dlg.showModal();
}
$("provider").addEventListener("change", e => { $("model").value = PROVIDERS[e.target.value].model; });
$("open").onclick = openSettings;
$("cancel").onclick = () => dlg.close();
$("save").onclick = () => {
  cfg = {provider:$("provider").value, key:$("key").value.trim(), model:$("model").value.trim(), sys:$("sys").value.trim()};
  saveCfg(); dlg.close();
};
$("load").onclick = async () => {
  const p = $("provider").value, key = $("key").value.trim(), msg = $("loadmsg");
  if (!key) { msg.textContent = "Paste your key first."; return; }
  msg.textContent = "Loading…";
  try {
    const r = await fetch(PROVIDERS[p].list, {headers:{"Authorization":"Bearer " + key}});
    const d = await r.json();
    if (!r.ok) throw new Error((d.error && d.error.message) || "Failed (" + r.status + ")");
    let ids = d.data.map(m => m.id);
    if (p === "groq") ids = ids.filter(i => !/whisper|guard|tts|orpheus|playai/i.test(i));
    if (p === "openrouter") ids = ids.filter(i => /:free$|^openrouter\/free$/.test(i));
    $("models").innerHTML = ids.map(i => '<option value="' + i + '">').join("");
    msg.textContent = ids.length + " models found. Tap the model box to pick one.";
  } catch (e) { msg.textContent = "Error: " + e.message; }
};
$("clear").onclick = () => { history = []; showEmpty(); };

input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  if (!cfg.key) { openSettings(); return; }
  input.value = ""; input.style.height = "auto";
  add("me", text); history.push({role:"user", content:text});
  send.disabled = true;
  const wait = add("ai", "…");
  try {
    const res = await fetch(PROVIDERS[cfg.provider].url, {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + cfg.key},
      body: JSON.stringify({model:cfg.model, messages:[{role:"system", content:cfg.sys}, ...history.slice(-20)]})
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || "Request failed (" + res.status + ")");
    const reply = data.choices[0].message.content;
    wait.textContent = reply; history.push({role:"assistant", content:reply});
  } catch (err) {
    wait.remove(); history.pop();
    add("err", "Error: " + err.message + ". Check your key and model name in Settings.");
  }
  send.disabled = false; log.scrollTop = log.scrollHeight;
});

showEmpty();
</script>
</body>
</html>
